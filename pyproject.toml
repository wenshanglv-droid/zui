[project]
name = "zui"
version = "0.1.0"
description = "zui - ComfyUI environment operating system: manage, repair, accelerate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "zui contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "websockets>=14.0",
  "aiosqlite>=0.20",
  "watchfiles>=1.0",
  "typer>=0.15",
  "rich>=13.9",
  "pydantic-settings>=2.7",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "psutil>=6.1",
  "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["pywebview>=5.1"]
nvidia = ["nvidia-ml-py>=12.560"]

[project.scripts]
zui = "zui.__main__:app"

[dependency-groups]
dev = [
  "ruff>=0.9",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-timeout>=2.3",
  "types-pyyaml>=6.0",
  "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zui"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["win32.*", "pywinpty.*", "webview.*", "pynvml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
addopts = "-q"
